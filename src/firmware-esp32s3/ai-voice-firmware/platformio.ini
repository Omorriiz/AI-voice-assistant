; Нильс — ESP32-S3 голосовой ассистент с ключевым словом «Привет ESP»
; Фреймворк ESP-IDF (не Arduino): нужен для распознавания ключевого слова esp-sr.
; Модель «Привет ESP» собирается и прошивается скриптом flash_models.py после каждой загрузки.
; Подробности — в README.md

[platformio]
src_dir = main

[env:esp32-s3-devkitc-1]
; 6.10.0+ = ESP-IDF 5.4 (проект требует 5.3 <= IDF < 6.0)
platform = espressif32 @ ^6.10.0
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
upload_speed = 115200
upload_port = COM5
monitor_port = COM5
monitor_filters = esp32_exception_decoder

; === N16R8: 16MB Flash (QIO) + 8MB PSRAM (OPI) ===
; PSRAM включается в sdkconfig.defaults (CONFIG_SPIRAM_MODE_OCT)
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

extra_scripts = post:flash_models.py
